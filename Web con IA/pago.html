<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SportBook - Pago</title>

    <link rel="stylesheet"
          href="css/styles.css">

</head>


<body>

<header class="header">

    <div class="logo">
        SPORT<span>BOOK</span>
    </div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="#">Mis reservas</a>
        <a href="#">Contacto</a>
    </nav>

</header>


<main class="container">

    <div class="steps">

        <div class="step completed">
            <span>✓</span>
            Deporte
        </div>

        <div class="step completed">
            <span>✓</span>
            Pista y horario
        </div>

        <div class="step active">
            <span>3</span>
            Pago
        </div>

        <div class="step">
            <span>4</span>
            Confirmación
        </div>

    </div>


    <section class="payment">

        <!-- RESUMEN -->

        <aside class="summary">

            <h2>Tu reserva</h2>

            <div class="summary-line">
                <span>Deporte</span>
                <strong id="deporte">
                    -
                </strong>
            </div>

            <div class="summary-line">
                <span>Pista</span>
                <strong id="pista">
                    -
                </strong>
            </div>

            <div class="summary-line">
                <span>Fecha</span>
                <strong id="fecha">
                    -
                </strong>
            </div>

            <div class="summary-line">
                <span>Hora</span>
                <strong id="hora">
                    -
                </strong>
            </div>

            <hr>

            <div class="total">

                <span>Total</span>

                <strong id="total">
                    -
                </strong>

            </div>

        </aside>


        <!-- FORMULARIO -->

        <div class="payment-form">

            <h1>Datos de pago</h1>

            <p class="subtitle">
                Introduce los datos de pago para completar
                tu reserva.
            </p>


            <form onsubmit="realizarPago(event)">

                <label>
                    Número de tarjeta
                </label>

                <input
                    type="text"
                    placeholder="1234 5678 9012 3456"
                    maxlength="19"
                    required
                >


                <div class="form-row">

                    <div>

                        <label>
                            Caducidad
                        </label>

                        <input
                            type="text"
                            placeholder="MM/AA"
                            required
                        >

                    </div>


                    <div>

                        <label>
                            CVV
                        </label>

                        <input
                            type="password"
                            placeholder="•••"
                            maxlength="3"
                            required
                        >

                    </div>

                </div>


                <label>
                    Nombre del titular
                </label>

                <input
                    type="text"
                    placeholder="Nombre y apellidos"
                    required
                >


                <div class="secure-payment">

                    🔒 Pago seguro

                    <small>
                        Esta demostración no realiza
                        ningún cargo real.
                    </small>

                </div>


                <button
                    type="submit"
                    class="btn-primary full">

                    Confirmar y pagar

                </button>

            </form>

        </div>

    </section>

</main>


<script>

const reserva =
    JSON.parse(localStorage.getItem("reserva"));


if (!reserva) {

    window.location.href = "index.html";

}


// Mostrar información

document.getElementById("deporte")
    .textContent = reserva.deporte;

document.getElementById("pista")
    .textContent = reserva.pista;

document.getElementById("fecha")
    .textContent = reserva.fecha;

document.getElementById("hora")
    .textContent = reserva.hora;

document.getElementById("total")
    .textContent = reserva.precio + " €";


// Simular pago

function realizarPago(event) {

    event.preventDefault();


    // Generar código de reserva

    const codigo =
        "SP-" +
        Math.floor(
            100000 + Math.random() * 900000
        );


    reserva.codigo = codigo;


    localStorage.setItem(
        "reserva",
        JSON.stringify(reserva)
    );


    window.location.href =
        "confirmacion.html";

}

</script>

</body>
</html>
